name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Application
        run: go build -v ./...

      - name: Run Tests
        run: go test -v ./...

  deploy:
    name: Deploy to Zoho Catalyst AppSail
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Image
        run: |
          docker build -t quiz-api:latest -f Dockerfile.catalyst .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Zoho Catalyst CLI
        run: npm install -g zcatalyst-cli

      - name: Deploy to Zoho Catalyst AppSail
        env:
          ZCATALYST_NON_INTERACTIVE: "true"
          CATALYST_RAW_TOKEN: "${{ secrets.CATALYST_TOKEN }}"
          CATALYST_RAW_PROJECT: "${{ secrets.CATALYST_PROJECT_ID }}"
          CATALYST_RAW_ORG: "${{ secrets.CATALYST_ORG_ID }}"
        run: |
          CLEAN_TOKEN=$(echo -n "$CATALYST_RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_PROJECT=$(echo -n "$CATALYST_RAW_PROJECT" | tr -d '[:space:]')
          CLEAN_ORG=$(echo -n "$CATALYST_RAW_ORG" | tr -d '[:space:]')

          CMD="catalyst deploy appsail --name quiz-api --source docker://quiz-api:latest --port 8080 --dc in --non-interactive --token $CLEAN_TOKEN"
          if [ -n "$CLEAN_PROJECT" ]; then
            CMD="$CMD --project $CLEAN_PROJECT"
          fi
          if [ -n "$CLEAN_ORG" ]; then
            CMD="$CMD --org $CLEAN_ORG"
          fi

          eval "$CMD"


